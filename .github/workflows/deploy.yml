name: Deploy to GitHub Pages

# Builds the Astro site and deploys dist/ to GitHub Pages.
# REQUIRES a one-time repo setting: Settings -> Pages -> Source = "GitHub Actions"
# (changing from "Deploy from a branch"). Until then this workflow will not publish.
# Runs only on push to main; merging the reface branch is gated on Barry's approval.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
